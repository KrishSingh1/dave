stages:
  - build
  - deploy

default:
  tags:
    - docker

# ── Shared compile template ──────────────────────────────────────────────────
.compile_base:
  stage: build
  image: gcc:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake libnetcdf-dev
  script:
    - cmake -B build_ci -S .
    - cmake --build build_ci -- -j$(nproc)
    - build_ci/runtests
  cache:
    key: cmake-$CI_COMMIT_REF_SLUG
    paths:
      - build_ci/

# Compile check on every merge request.
# Blocks merging when "Pipelines must succeed" is enabled in project settings
# (Settings → Merge requests → Merge checks).
compile:mr:
  extends: .compile_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Compile check on direct pushes to the primary branch.
compile:branch:
  extends: .compile_base
  rules:
    - if: $CI_COMMIT_BRANCH == "lpjguess_dave"

# ── Documentation deploy (GitLab Pages) ─────────────────────────────────────
# The job MUST be named "pages" for GitLab to publish the artifacts.
pages:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_BRANCH == "lpjguess_dave"
  before_script:
    - pip install --quiet mkdocs pymdown-extensions
  script:
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public

# ── Documentation deploy (GitHub Pages mirror) ───────────────────────────────
# GitLab remains the source of the documentation. This job publishes the site
# produced by `pages` to the protected gh-pages branch of hie-dave/dave-docs.
pages:github:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: pages
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "lpjguess_dave"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git openssh-client rsync
    - eval "$(ssh-agent -s)"
    - chmod 400 "$GITHUB_DOCS_SSH_PRIVATE_KEY"
    - ssh-add "$GITHUB_DOCS_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$GITHUB_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - git clone --branch gh-pages git@github.com:hie-dave/dave-docs.git github-pages
    - rsync -a --delete --exclude .git public/ github-pages/
    - git -C github-pages config user.name "DAVE documentation deployment"
    - git -C github-pages config user.email "dave-docs-deploy@users.noreply.github.com"
    - git -C github-pages add --all
    - |
      if ! git -C github-pages diff --cached --quiet; then
        git -C github-pages commit -m "Publish documentation for ${CI_COMMIT_SHA}"
        git -C github-pages push origin gh-pages
      fi
